<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppy Playtime - Fuga da Fábrica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>PLAYTIME CO.</h1>
            <p>Sobreviva à fábrica de brinquedos!</p>
        </header>

        <section class="status-panel">
            <div class="status-box">Local: <span id="local-atual">Entrada Principal</span></div>
            <div class="status-box">Chaves Encontradas: <span id="chaves-count">0</span> / 3</div>
        </section>

        <section class="display-panel">
            <div id="cenario-img" class="cenario entrada"></div>
            <p id="texto-narrativa">Você está na recepção escura da Playtime Co. As portas principais estão trancadas por uma tranca elétrica. Você precisa encontrar 3 pilhas para carregar o GrabPack e escapar!</p>
        </section>

        <section class="action-panel">
            <button id="btn-acao1" class="btn">Procurar Pilha</button>
            <button id="btn-acao2" class="btn">Ir para o Galpão Central</button>
        </section>

        <footer>
            <button id="btn-reiniciar" class="btn-danger">Reiniciar Jogo</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
